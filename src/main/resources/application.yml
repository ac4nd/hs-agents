server:
  servlet:
    # HTTP 请求/响应强制 UTF-8，防止中文乱码（Spring Boot 4 默认即 UTF-8，显式声明保险）
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: godlikeagents
  profiles:
    active: dev
  config:
    import: classpath:codegen.yml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
# 在 banner.txt 中显示项目版本，使用 @project.version@ 从 pom.xml 获取
project:
  version: @project.version@

server:
  port: 8000

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    # === PostgreSQL 数据源（默认启用） ===
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://47.107.160.31:5432/godlikeagents?currentSchema=public&stringtype=unspecified
    username: postgres
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      test-on-borrow: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,log4j

  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      # 如果Redis 服务未设置密码，需要将password删掉或注释，而不是设置为空字符串
#      password: 123456
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数 默认8 ，负数表示没有限制
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-wait: -1
          # 连接池中的最大空闲连接 默认8
          max-idle: 8
          # 连接池中的最小空闲连接 默认0
          min-idle: 0
  cache:
    enabled: false
    # 缓存类型 redis、none(不使用缓存)
    type: redis
    # 缓存时间(单位：ms)
    redis:
      time-to-live: 3600000
      # 缓存null值，防止缓存穿透
      cache-null-values: true
    caffeine:
      spec: initialCapacity=50,maximumSize=1000,expireAfterWrite=600s
  # 邮件配置
  mail:
    host: smtp.example.com
    port: 587
    username: your-email@example.com
    password: 123456
    properties:
      smtp:
        auth: true
        starttls:
          enable: true
    # 邮件发送者
    from: 18659922013@163.com

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      # 主键ID类型
      id-type: none
      # 逻辑删除对应的全局属性名（注意：须是对象属性名，不能是表字段名，如 isDeleted 而非 is_deleted，否则逻辑删除失效）
      logic-delete-field: isDeleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 安全配置
security:
  session:
    type: jwt # 会话方式 jwt/redis-token
    access-token-time-to-live: 7200 # 访问令牌 有效期(单位：秒)，默认 2 小时，-1 表示永不过期
    refresh-token-time-to-live: 604800 # 刷新令牌有效期(单位：秒)，默认 7 天，-1 表示永不过期
    jwt:
      secret-key: ${JWT_SECRET:your-jwt-secret-key-at-least-32-characters-long}
    redis-token:
      allow-multi-login: true # 是否允许多设备登录
  # 安全白名单路径，仅跳过 AuthorizationFilter 过滤器，还是会走 Spring Security 的其他过滤器(CSRF、CORS等)
  ignore-urls:
    - /api/v1/auth/login/** # 登录接口(账号密码登录、手机验证码登录和微信登录)
    - /api/v1/auth/captcha # 验证码获取接口
    - /api/v1/auth/sms/code # 发送登录短信验证码
    - /api/v1/auth/refresh-token # 刷新令牌接口
    - /api/v1/wxma/auth/** # 微信小程序认证接口(静默登录/手机号快捷登录/绑定手机号)
    - /api/v1/logs/** # 日志接口(访问日志列表)
    - /api/v1/agent/** # AI Agent 接口
  # 非安全端点路径，完全绕过 Spring Security 的安全控制
  unsecured-urls:
    - ${springdoc.swagger-ui.path}
    - /doc.html
    - /swagger-ui/**
    - /v3/api-docs/**
    - /webjars/**
    - /favicon.ico
    - /error

# 文件存储配置
oss:
  # OSS 类型 (目前支持aliyun、minio、local)
  type: minio
  # MinIO 对象存储服务
  minio:
    # MinIO 服务地址
    endpoint: http://47.107.160.31:9000
    # 访问凭据
    access-key: minioadmin
    # 凭据密钥
    secret-key: minioadmin
    # 存储桶名称
    bucket-name: godlikeagents
    # (可选) 自定义域名：配置后，文件 URL 会使用该域名格式
    custom-domain:
  # 阿里云OSS对象存储服务
  aliyun:
    # 服务Endpoint
    endpoint: oss-cn-hangzhou.aliyuncs.com
    # 访问凭据`
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:your-access-key-id}
    # 凭据密钥
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:your-access-key-secret}
    # 存储桶名称
    bucket-name: default
  # 本地存储
  local:
    # 文件存储路径 请注意下，mac用户请使用 /Users/your-username/your-path/，否则会有权限问题，windows用户请使用 D:/your-path/
    storage-path: /Users/theo/home/
# 短信配置
sms:
  # 阿里云短信
  aliyun:
    accessKeyId: ${SMS_ACCESS_KEY_ID:your-sms-access-key-id}
    accessKeySecret: ${SMS_ACCESS_KEY_SECRET:your-sms-access-key-secret}
    domain: dysmsapi.aliyuncs.com
    regionId: cn-shanghai
    signName: 氦闪技术
    templates:
      #  注册短信验证码模板
      register: SMS_22xxx771
      # 登录短信验证码模板
      login: SMS_22xxx772
      # 修改手机号短信验证码模板
      change-mobile: SMS_22xxx773

# springdoc配置： https://springdoc.org/properties.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: "系统管理"
      paths-to-match: "/**"
      packages-to-scan:
        - com.hypersense.boot.auth.controller
        - com.hypersense.boot.system.controller
        - com.hypersense.boot.platform.file.controller
        - com.hypersense.boot.platform.codegen.controller
    - group: "AI智能体"
      paths-to-match: "/**"
      packages-to-scan:
        - com.hypersense.boot.framework.agents.controller
  default-flat-param-object: true

# knife4j 接口文档配置
knife4j:
  # 是否开启 Knife4j 增强功能
  enable: true # 设置为 true 表示开启增强功能
  # 生产环境配置
  production: false # 设置为 true 表示在生产环境中不显示文档，为 false 表示显示文档（通常在开发环境中使用）
  setting:
    language: zh_cn

# xxl-job 定时任务配置
xxl:
  job:
    # 定时任务开关
    enabled: false
    admin:
      # 调度中心地址,多个逗号分隔
      addresses: http://47.107.160.31:8080/xxl-job-admin
    accessToken: ${XXL_JOB_TOKEN:default_token}
    # 执行器配置
    executor:
      appname: xxl-job-executor-${spring.application.name} # 执行器AppName
      address: # 执行器注册地址，默认为空，多网卡时可手动设置
      ip: # 执行器IP，默认为空，多网卡时可手动设置
      port: 9999 # 执行器通讯端口
      logpath: /data/applogs/xxl-job/jobhandler # 任务运行日志文件存储磁盘路径
      logretentiondays: 30 # 日志保存天数，值大于3时生效

# 验证码配置
captcha:
  # 验证码类型 circle-圆圈干扰验证码|gif-Gif验证码|line-干扰线验证码|shear-扭曲干扰验证码
  type: circle
  # 验证码宽度
  width: 120
  # 验证码高度
  height: 40
  # 验证码干扰元素个数
  interfere-count: 2
  # 文本透明度(0.0-1.0)
  text-alpha: 0.8
  # 验证码字符配置
  code:
    # 验证码字符类型 math-算术|random-随机字符
    type: math
    # 验证码字符长度，type=算术时，表示运算位数(1:个位数运算 2:十位数运算)；type=随机字符时，表示字符个数
    length: 1
  # 验证码字体
  font:
    # 字体名称 Dialog|DialogInput|Monospaced|Serif|SansSerif
    name: SansSerif
    # 字体样式 0-普通|1-粗体|2-斜体
    weight: 1
    # 字体大小
    size: 24
  # 验证码有效期(秒)
  expire-seconds: 120

# 微信小程配置
wx:
  miniapp:
    app-id: ${WX_MINIAPP_APP_ID:your-app-id}
    app-secret: ${WX_MINIAPP_APP_SECRET:your-app-secret}

# 多租户配置
tenant:
  # 租户字段名（默认：tenant_id）
  column: tenant_id
  # 忽略多租户过滤的表名列表（系统表、租户表等不需要租户隔离的表）
  ignore-tables:
    - sys_tenant # 租户表本身
    - sys_tenant_plan # 租户套餐表
    - sys_tenant_plan_menu # 租户套餐菜单关联表
    - sys_menu # 菜单表（功能入口定义，所有租户共享）
    - sys_dict # 字典表（通常共享）
    - sys_dict_item # 字典项表（通常共享）
    - sys_config # 系统配置表（通常共享）
    - gen_table # 代码生成表（平台共用）
    - gen_table_column # 代码生成字段表（平台共用）
    - agent_memory # JdbcTemplate + pgvector 管理，不走 MyBatis-Plus 租户拦截器
# ============================================

# AI Agent 配置
agent:
  llm:
    # LLM 提供商：openai / ollama
    provider: openai
    # 温度（0.0 - 2.0）
    temperature: 0.7
    # 最大生成 token 数
    max-tokens: 4096
    # OpenAI 兼容 API 配置（支持 OpenAI / DeepSeek / 通义千问等）
    openai:
      endpoint: https://open.bigmodel.cn/api/coding/paas/v4
      api-key: f6de7aff013e49be9fdd432f17e7aca7.HyRXWDaXBUdcDS2b
      model-name: glm-4.7
    # Ollama 本地模型配置
    ollama:
      endpoint: http://localhost:11434
      model-name: llama3
  deep:
    # 图递归限制
    recursion-limit: 50
    # 最大迭代次数
    max-iterations: 25
    # 是否启用 PostgreSQL 检查点持久化
    checkpoint-enabled: true
    # 会话 TTL（秒），默认 30 分钟
    session-ttl: 1800
  # 技能系统配置
  skills:
    dirs:
      - D:/project/myproject/ac4nd/skills
  # 长期记忆配置（智谱 Embedding-3 + pgvector）
  memory:
    enabled: true
    embedding-model: embedding-3
    embedding-dimensions: 1536
    retention-days: 90
    similarity-threshold: 0.7
    max-retrieval-count: 10
  # 工具配置
  tools:
    search:
      # 是否启用网络搜索（SearXNG 已部署在远程服务器）
      enabled: true
      # SearXNG 搜索 API 地址
      endpoint: http://47.107.160.31:8888/search
      # API 密钥（SerpAPI 等需要，SearXNG 不需要）
      api-key:
      # 最大返回条数
      max-results: 5
    sandbox:
      # 是否启用沙箱
      enabled: false
      # 沙箱类型：local（本地子进程）/ remote（远程云沙箱）/ custom（容器沙箱）
      type: local
      # 执行超时（秒）
      timeout: 30
      # 最大输出字节数（超出截断）
      max-output-bytes: 65536
      # 允许的编程语言白名单（逗号分隔）
      allowed-languages: python,javascript,shell
      # 工作目录（文件操作的根路径）
      work-dir: ${java.io.tmpdir}/agent-sandbox
      # --- 本地沙箱配置 ---
      local:
        # 是否清理环境变量
        sanitize-env: true
      # --- 远程云沙箱配置 ---
      remote:
        # 服务提供商：modal / daytona / runloop
        provider: modal
        # API 端点
        endpoint:
        # API 密钥
        api-key:
      # --- 自定义容器沙箱配置 ---
      custom:
        # 容器运行时：docker / podman
        runtime: docker
        # 镜像名称
        image: python:3.12-slim

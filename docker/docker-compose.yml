# 创建一个名为 "godlikeagents" 的桥接网络，在同一个网络中的容器可以通过容器名互相访问
networks:
  godlikeagents:
    driver: bridge

services:
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: postgresql
    restart: unless-stopped # 重启策略：除非手动停止容器，否则自动重启
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_USER=postgres # 超级用户
      - POSTGRES_PASSWORD=123456 # 超级用户密码
      - POSTGRES_DB=godlikeagents # 默认创建的数据库
    volumes:
      - ./postgresql/conf/postgresql.conf:/etc/postgresql/postgresql.conf # 挂载配置文件
      - ./postgresql/data:/var/lib/postgresql/data # 持久化 PostgreSQL 数据
      - ../sql/postgresql:/docker-entrypoint-initdb.d # 初始化 SQL 脚本目录
    command: postgres -c config_file=/etc/postgresql/postgresql.conf # 使用自定义配置文件启动
    ports:
      - 5432:5432
    networks:
      - godlikeagents # 加入 "godlikeagents" 网络

  redis:
    image: redis:7.2.3
    container_name: redis
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf --requirepass 123456 --appendonly no # 启动 Redis 服务并添加密码为：123456，默认不开启 Redis AOF 方式持久化配置
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./redis/data:/data
      - ./redis/config/redis.conf:/etc/redis/redis.conf
    ports:
      - 6379:6379
    networks:
      - godlikeagents

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - TZ=Asia/Shanghai
      - LANG=en_US.UTF-8
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio/data:/data
      - ./minio/config:/root/.minio
    networks:
      - godlikeagents

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: xxl-job-admin
    restart: unless-stopped
    environment:
      PARAMS: '--spring.datasource.url=jdbc:postgresql://postgresql:5432/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=postgres --spring.datasource.password=123456 --spring.datasource.driver-class-name=org.postgresql.Driver'
    volumes:
      - ./xxljob/logs:/data/applogs
    ports:
      - 8080:8080
    networks:
      - godlikeagents

  # ================================
  # SearXNG — 自托管元搜索引擎（Agent 网络搜索工具后端）
  # 文档：https://docs.searxng.org/
  # ================================
  searxng:
    image: bpwkvf30g2jo7t6oft.xuanyuan.run/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - SEARXNG_BASE_URL=http://localhost:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro # 只读挂载配置文件
      - ./searxng/data:/etc/searxng/data                     # 持久化数据（搜索偏好等）
    ports:
      - "8888:8080" # 宿主机 8888 → 容器 8080
    networks:
      - godlikeagents

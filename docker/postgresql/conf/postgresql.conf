# ============================
# PostgreSQL 配置文件
# 对应 MySQL my.cnf 的 PostgreSQL 等效配置
# ============================

# ----------------------------
# 连接与认证
# ----------------------------
listen_addresses = '*'          # 等效 MySQL bind-address = 0.0.0.0，允许远程连接
port = 5432                     # 监听端口（默认5432）
max_connections = 200           # 最大连接数

# ----------------------------
# 内存与资源
# ----------------------------
shared_buffers = 256MB          # 共享缓冲区大小（建议为物理内存的 1/4）
effective_cache_size = 768MB    # 查询优化器可用的缓存大小
work_mem = 4MB                  # 排序和哈希操作的内存大小
maintenance_work_mem = 64MB     # 维护操作（VACUUM、CREATE INDEX）的内存

# ----------------------------
# WAL（预写日志）
# ----------------------------
wal_level = replica             # WAL 级别（支持复制）
max_wal_size = 1GB              # WAL 最大大小
min_wal_size = 80MB             # WAL 最小大小
checkpoint_completion_target = 0.9

# ----------------------------
# 查询优化
# ----------------------------
random_page_cost = 1.1          # SSD 建议设为 1.1，HDD 保持默认 4.0
effective_io_concurrency = 200  # SSD 建议设为 200

# ----------------------------
# 日志
# ----------------------------
logging_collector = on          # 启用日志收集
log_directory = 'log'           # 日志目录
log_filename = 'postgresql-%Y-%m-%d.log'  # 日志文件名格式
log_statement = 'ddl'           # 记录 DDL 语句
log_min_duration_statement = 1000  # 记录执行超过 1 秒的慢查询（单位：毫秒）

# ----------------------------
# 字符集（等效 MySQL utf8mb4）
# ----------------------------
# PostgreSQL 默认使用 UTF8 编码，创建数据库时指定：
# CREATE DATABASE godlikeagents_admin_tenant WITH ENCODING 'UTF8' LC_COLLATE 'en_US.utf8' LC_CTYPE 'en_US.utf8';

# ----------------------------
# 自动清理
# ----------------------------
autovacuum = on                 # 启用自动 VACUUM
autovacuum_max_workers = 4      # 自动 VACUUM 工作进程数
